name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # assembleRelease runs R8 against the keep rules; without a keystore it produces an unsigned APK.
      - name: Build, test, and lint
        run: ./gradlew assembleDebug testDebugUnitTest :app:lintDebug assembleRelease

      - name: Upload test results and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/test-results/
            **/build/reports/tests/
            **/build/reports/lint-results-*
          if-no-files-found: ignore
