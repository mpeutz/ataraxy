name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Debug only: release signing reads KEYSTORE_* from local.properties, which CI doesn't have.
      # :wear:lintDebug is skipped until the missing com.google.android.wearable.standalone
      # meta-data error is fixed.
      - name: Build, test, and lint
        run: ./gradlew assembleDebug testDebugUnitTest :app:lintDebug

      - name: Upload test results and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/test-results/
            **/build/reports/tests/
            **/build/reports/lint-results-*
          if-no-files-found: ignore
